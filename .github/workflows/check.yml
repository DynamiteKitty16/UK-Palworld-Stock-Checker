name: Palworld Stock Check

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes — normal silent checks
    - cron: "0 12 * * *"     # once a day at 12:00 UTC — daily heartbeat summary
  workflow_dispatch:          # manual "Run" button (always reports back)
    inputs:
      test_ping:
        description: "Send a test ping to check the @ works"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # lets it push seen.json back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4

      - name: Run checker
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          HEARTBEAT: ${{ github.event.schedule == '0 12 * * *' && '1' || '0' }}
          TEST_MODE: ${{ github.event.inputs.test_ping == 'true' && '1' || '0' }}
        run: python check_stock.py          # ← CHANGED: was probShopifySites.py

      - name: Save state back to repo
        run: |
            git config user.name "stock-bot"
            git config user.email "stock-bot@users.noreply.github.com"
            git add seen.json 2>/dev/null || true
            git diff --staged --quiet || git commit -m "update state"
            git push || true