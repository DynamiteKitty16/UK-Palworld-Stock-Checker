name: Palworld Stock Check

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (see timing note below)
  workflow_dispatch:          # lets you run it manually from the Actions tab

# Allow the workflow to push seen.json back to the repo
permissions:
  contents: write

# Prevent overlapping runs from racing on seen.json
concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run stock checker
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python check_stock.py

      - name: Persist seen.json
        run: |
          if [[ -n "$(git status --porcelain seen.json)" ]]; then
            git config user.name  "stock-bot"
            git config user.email "stock-bot@users.noreply.github.com"
            git add seen.json
            git commit -m "Update seen.json [skip ci]"
            git push
          else
            echo "No changes to seen.json"
          fi